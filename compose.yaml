x-app: &app
  image: ${CR_IMAGE:-coursereview-backend}
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    volumes:
      - postgres18_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coursereview}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-coursereview}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cache:
    image: valkey/valkey:9-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    <<: *app
    environment:
      PYTHONUNBUFFERED: "1"
      GUNICORN_CMD_ARGS: "--control-socket /tmp/gunicorn.ctl --worker-tmp-dir /tmp"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "__import__('urllib.request').request.urlopen('http://127.0.0.1:8000/api/user/status/',timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  migrate:
    image: ${CR_IMAGE:-coursereview-backend}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["python", "django_manage.py", "migrate"]
    restart: "no"

  worker:
    <<: *app
    environment:
      PYTHONUNBUFFERED: "1"
      LLM__BASE_URL: ${LLM__BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "celery",
        "-A",
        "website.celery",
        "worker",
        "--loglevel=info",
        "--pool=${CELERY_POOL:-threads}",
      ]
    restart: unless-stopped

  beat:
    <<: *app
    environment:
      PYTHONUNBUFFERED: "1"
    # The runtime image runs as a non-root user with an unwritable working
    # directory; the default ./celerybeat-schedule raises PermissionError.
    command:
      [
        "celery",
        "-A",
        "website.celery",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    restart: unless-stopped

volumes:
  postgres18_data:
