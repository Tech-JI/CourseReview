services:
  db:
    ports:
      - "5432:5432"

  cache:
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE__URL: ${DATABASE__URL:-postgres://admin:test@db:5432/coursereview}
      REDIS__URL: ${REDIS__URL:-redis://cache:6379/0}
    volumes:
      - ./config.yaml:/app/config.yaml:ro

  migrate:
    build:
      context: .
      dockerfile: Containerfile
    env_file:
      - .env
    environment:
      DATABASE__URL: ${DATABASE__URL:-postgres://admin:test@db:5432/coursereview}
      REDIS__URL: ${REDIS__URL:-redis://cache:6379/0}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
