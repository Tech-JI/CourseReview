services:
  db:
    image: postgres:18-alpine
    volumes:
      - postgres18_data:/var/lib/postgresql/
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-coursereview}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d coursereview"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cache:
    image: valkey/valkey:9-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
    image: coursereview
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-coursereview}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test}
      - DATABASE__URL=${DATABASE__URL:-postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-test}@${DB_HOST:-localhost}:${DB_PORT:-5432}/${POSTGRES_DB:-coursereview}}
      - REDIS_URL=${REDIS_URL:-redis://cache:6379/0}
      - REDIS__URL=${REDIS__URL:-redis://cache:6379/0}
      - DEBUG=${DEBUG:-False}
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "__import__('urllib.request').request.urlopen('http://127.0.0.1:8000/api/user/status/',timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: coursereview-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    restart: unless-stopped

volumes:
  postgres18_data:
